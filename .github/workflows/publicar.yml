# Publica el sitio en GitHub Pages cada vez que se sube un cambio a main.
# Antes de publicar arma la lista de fotos, así el catálogo muestra las nuevas sin tocar código.
name: Publicar sitio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Armar la lista de fotos
        run: node scripts/generar-fotos.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - id: despliegue
        uses: actions/deploy-pages@v4
