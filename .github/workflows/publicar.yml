# Publica el sitio en GitHub Pages cada vez que se sube un cambio a main.
# Antes de publicar lee perfumes.xlsx y la carpeta de fotos, así el catálogo se actualiza sin tocar código.
name: Publicar sitio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Leer perfumes.xlsx y las fotos
        run: node scripts/generar-datos.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - id: despliegue
        uses: actions/deploy-pages@v4
